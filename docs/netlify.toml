# Fully static site: every route is RouteBuilder.single / preRender (no serverRender),
# so the elm-pages Netlify functions (render/server-render) are unused. We do NOT
# declare `functions` here — Netlify's default functions dir is netlify/functions, so
# it ignores the elm-pages `functions/` output and skips the (heavy, failing) bundle.
[build]
  publish = "dist/"
  # build:ci regenerates only the gitignored reference.json (elm make --docs, no rules)
  # and runs elm-pages against the COMMITTED examples data. It skips build:assets'
  # rule-driven harness (gen-record-build/gen-barrel), whose rules live in the
  # sibling jackhp95/elm-review-cem package that isn't present on CI (or published yet).
  # Regenerate examples locally with `pnpm run build:assets` and commit before deploying.
  #
  # SELF-CONTAINED on CI: the docs app imports HtmlIr.* (via ../src M3e.*) and
  # TypedHtml.* (Examples/Guide routes). Those two packages are unpublished sibling
  # repos, so their source is VENDORED into docs/vendor/elm-foundation (a committed
  # source-directory in elm.json) instead of the old `../../elm-*/src` paths that
  # don't exist on Netlify. After changing HtmlIr or TypedHtml upstream, run
  # `pnpm run build:vendor` and commit the refreshed vendor/elm-foundation.
  #
  # BUILD-TIME CACHING (see ../plans/2026-08-12-netlify-build-optimization.md):
  # The dominant cost of this build is the two `lamdera make` Elm compiles that
  # `elm-pages build` runs (client + server apps). Two caches make rebuilds
  # incremental:
  #   1. ELM_HOME -> $NETLIFY_BUILD_BASE/cache/elm (below). NETLIFY_BUILD_BASE is
  #      /opt/buildhome and its /cache subtree is the persisted Netlify cache, so
  #      this persists Elm's DEPENDENCY artifacts (…/packages/.../artifacts.dat)
  #      across builds — the biggest single saver. (Already in place.)
  #   2. docs/elm-stuff via the netlify-plugin-cache block below — persists the
  #      PROJECT's own compiled artifacts, including the nested
  #      elm-stuff/elm-pages/{client,server} trees elm-pages compiles into.
  # pnpm's content-addressable store and node_modules are auto-cached by Netlify,
  # so `pnpm install` is not the bottleneck. NOTE: committing docs/.elm-pages saves
  # NO build time here — elm-pages regenerates it from scratch every build.
  command = "export ELM_HOME=\"$NETLIFY_BUILD_BASE/cache/elm\" && corepack enable && pnpm install --frozen-lockfile && pnpm run build:ci"

[build.environment]
  NODE_VERSION = "22"

# Persist the project's compiled Elm artifacts across builds so the two
# `lamdera make` compiles inside `elm-pages build` are incremental instead of
# from-scratch. Paths are relative to the Netlify base directory (this file's dir,
# docs/), so "elm-stuff" == docs/elm-stuff and covers the nested
# elm-stuff/elm-pages/{client,server}/elm-stuff/0.19.1 that elm-pages compiles
# into. Netlify auto-installs plugins declared here (no package.json entry needed);
# the plugin saves the paths only after a SUCCESSFUL build and restores them next
# build. (Elm's dependency artifacts are already cached via ELM_HOME above.)
# Deliberately NOT caching .elm-pages: it is regenerated from scratch each build.
[[plugins]]
  package = "netlify-plugin-cache"
  [plugins.inputs]
    paths = ["elm-stuff"]

[dev]
  command = "pnpm start"
  targetPort = 1234
  autoLaunch = true
  framework = "#custom"

# /getting-started/overview was merged into the Guide (its every link already
# lived in the Guide's chapter list). Redirect the old URL so external links and
# bookmarks land on the canonical page.
[[redirects]]
  from = "/getting-started/overview"
  to = "/guide"
  status = 301
  force = true

[[redirects]]
  from = "/reference"
  to = "/guide/reference"
  status = 301
  force = true

[[redirects]]
  from = "/roundtrip"
  to = "/guide/roundtrip"
  status = 301
  force = true

[[redirects]]
  from = "/"
  to = "/getting-started/welcome"
  status = 301
  force = true
